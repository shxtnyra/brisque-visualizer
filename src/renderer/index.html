<!-- Основной HTML-шаблон рендера: интерфейс BRISQUE Visualizer -->
<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' media: data:;" />
  <title>Brisque Visualizer</title>
  <link rel="stylesheet" href="./assets/base.css" />
  <link rel="stylesheet" href="./assets/style.css" />
</head>

<body>
  <div class="app">
    <div class="toolbar">
      <button id="open-btn">Открыть изображение</button>
      <div id="method-select-container" class="method-select-container"></div>
      <span id="zoom-info">Масштаб: 100%</span>
      <span class="hint">Колесо мыши — масштаб | ЛКМ + Тянуть — выделение области</span>
    </div>

    <div class="main-layout">
      <div class="workspace" id="workspace">
        <div class="image-wrapper" id="image-wrapper">
          <img id="target-image" draggable="false" />
          <div id="selection-box">
            <div class="resize-handle handle-nw" data-handle="nw"></div>
            <div class="resize-handle handle-ne" data-handle="ne"></div>
            <div class="resize-handle handle-sw" data-handle="sw"></div>
            <div class="resize-handle handle-se" data-handle="se"></div>
          </div>
        </div>
      </div>

      <div id="sidebar-resizer"></div>
      <div class="sidebar" id="sidebar">

        <div class="sidebar-header">
          <div id="selection-info">Размер: 0 x 0 px</div>
          <div id="brisque-score-container" style="display: none;">
            <span id="brisque-score-label">BRISQUE: </span><span id="brisque-score-val">0.00</span>
          </div>
        </div>

        <div class="sidebar-crop-preview">
          <h3>Выделенная область</h3>
          <div class="preview-container">
            <canvas id="preview-canvas"></canvas>
          </div>
        </div>

        <div class="tabs-nav" id="qa-tabs-nav" style="display: none;"></div>
        <div class="tabs-container" id="qa-tabs-container" style="display: none;"></div>

        <div id="academic-help-container"></div>
      </div>
    </div>
  </div>

  <div id="fullscreen-modal" class="fullscreen-modal" aria-hidden="true">
    <div class="fullscreen-panel">
      <div class="fullscreen-header">
        <span id="fullscreen-title" class="fullscreen-title"></span>
        <span id="fullscreen-zoom-info" class="fullscreen-zoom-info">Масштаб: 100%</span>
        <button type="button" id="fullscreen-reset-btn" class="fullscreen-action-btn">Сброс</button>
        <button type="button" id="fullscreen-close-btn" class="fullscreen-action-btn fullscreen-close-btn"
          aria-label="Закрыть">✕</button>
      </div>

      <div id="fullscreen-map-panel" class="fullscreen-content-panel" style="display: none;">
        <div class="chart-toolbar map-toolbar fullscreen-toolbar">
          <div class="chart-type-nav map-type-nav">
            <button class="map-type-btn fs-map-type-btn" data-map="mu" title="Локальное среднее яркости">μ</button>
            <button class="map-type-btn fs-map-type-btn" data-map="sigma" title="Локальный контраст">σ</button>
            <button class="map-type-btn fs-map-type-btn active" data-map="mscn">MSCN</button>
            <button class="map-type-btn fs-map-type-btn" data-map="horizontal">H</button>
            <button class="map-type-btn fs-map-type-btn" data-map="vertical">V</button>
            <button class="map-type-btn fs-map-type-btn" data-map="diagonal1">D1 ↘</button>
            <button class="map-type-btn fs-map-type-btn" data-map="diagonal2">D2 ↙</button>
          </div>
        </div>
        <div id="fullscreen-map-viewport" class="fullscreen-map-viewport">
          <canvas id="fullscreen-map-canvas"></canvas>
        </div>
        <p class="fullscreen-hint">Колесо — масштаб | ЛКМ — перемещение | Двойной клик — сброс | Esc — закрыть</p>
      </div>

      <div id="fullscreen-chart-panel" class="fullscreen-content-panel" style="display: none;">
        <div class="chart-toolbar fullscreen-toolbar">
          <div class="chart-type-nav">
            <button class="chart-type-btn fs-chart-type-btn active" data-chart="mscn">MSCN</button>
            <button class="chart-type-btn fs-chart-type-btn" data-chart="horizontal">H</button>
            <button class="chart-type-btn fs-chart-type-btn" data-chart="vertical">V</button>
            <button class="chart-type-btn fs-chart-type-btn" data-chart="diagonal1">D1 ↘</button>
            <button class="chart-type-btn fs-chart-type-btn" data-chart="diagonal2">D2 ↙</button>
          </div>
          <div class="chart-y-mode-nav">
            <span class="chart-y-mode-label">Ось Y:</span>
            <button class="chart-y-mode-btn fs-chart-y-mode-btn active" data-y-mode="pdf">PDF</button>
            <button class="chart-y-mode-btn fs-chart-y-mode-btn" data-y-mode="peak">Max-Norm</button>
          </div>
        </div>
        <div id="fullscreen-chart-container" class="fullscreen-chart-container">
          <canvas id="fullscreen-chart-canvas"></canvas>
        </div>
        <p class="fullscreen-hint">Esc — закрыть</p>
      </div>
    </div>
  </div>

  <script type="module" src="./src/renderer.ts"></script>
</body>

</html>
