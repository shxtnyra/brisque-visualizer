<!-- Основной HTML-шаблон рендера: интерфейс BRISQUE Visualizer -->
<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' media: data:;" />
  <title>Brisque Visualizer</title>
  <link rel="stylesheet" href="./assets/base.css" />
  <link rel="stylesheet" href="./assets/style.css" />
</head>

<body>
  <div class="app">
    <div class="toolbar">
      <button id="open-btn">Открыть изображение</button>
      <span id="zoom-info">Масштаб: 100%</span>
      <span class="hint">Колесо мыши — масштаб | ЛКМ + Тянуть — выделение области</span>
    </div>

    <div class="main-layout">
      <div class="workspace" id="workspace">
        <div class="image-wrapper" id="image-wrapper">
          <img id="target-image" draggable="false" />
          <div id="selection-box">
            <div class="resize-handle handle-nw" data-handle="nw"></div>
            <div class="resize-handle handle-ne" data-handle="ne"></div>
            <div class="resize-handle handle-sw" data-handle="sw"></div>
            <div class="resize-handle handle-se" data-handle="se"></div>
          </div>
        </div>
      </div>

      <div id="sidebar-resizer"></div>
      <div class="sidebar" id="sidebar">

        <div class="sidebar-header">
          <div id="selection-info">Размер: 0 x 0 px</div>
          <div id="brisque-score-container" style="display: none;">
            BRISQUE: <span id="brisque-score-val">0.00</span>
          </div>
        </div>

        <div class="tabs-nav" id="qa-tabs-nav" style="display: none;">
          <button class="tab-btn active" data-target="tab-maps">Карты</button>
          <button class="tab-btn" data-target="tab-charts">Графики</button>
          <button class="tab-btn" data-target="tab-features">Признаки</button>
        </div>

        <div class="tabs-container" id="qa-tabs-container" style="display: none;">

          <div class="tab-content active" id="tab-maps">
            <div class="qa-visuals">

              <h3>1. Выделенная область</h3>
              <div class="preview-container">
                <canvas id="preview-canvas"></canvas>
              </div>

              <h3 id="map-title">Карта MSCN <span class="hint-icon" data-hint="hint-mscn">?</span></h3>

              <div class="chart-toolbar map-toolbar">
                <div class="chart-type-nav map-type-nav">
                  <button class="map-type-btn" data-map="mu" title="Локальное среднее яркости">μ</button>
                  <button class="map-type-btn" data-map="sigma" title="Локальный контраст">σ</button>
                  <button class="map-type-btn active" data-map="mscn">MSCN</button>
                  <button class="map-type-btn" data-map="horizontal">H</button>
                  <button class="map-type-btn" data-map="vertical">V</button>
                  <button class="map-type-btn" data-map="diagonal1">D1 ↘</button>
                  <button class="map-type-btn" data-map="diagonal2">D2 ↙</button>
                </div>
              </div>

              <div class="preview-container">
                <canvas id="map-canvas"></canvas>
              </div>

            </div>
          </div>

          <div class="tab-content" id="tab-charts">
            <h3>Распределения MSCN <span class="hint-icon" data-hint="hint-chart-mscn">?</span></h3>

            <div class="chart-toolbar">
              <div class="chart-type-nav">
                <button class="chart-type-btn active" data-chart="mscn">MSCN</button>
                <button class="chart-type-btn" data-chart="horizontal">H</button>
                <button class="chart-type-btn" data-chart="vertical">V</button>
                <button class="chart-type-btn" data-chart="diagonal1">D1 ↘</button>
                <button class="chart-type-btn" data-chart="diagonal2">D2 ↙</button>
              </div>
              <div class="chart-y-mode-nav">
                <span class="chart-y-mode-label">Ось Y:</span>
                <button class="chart-y-mode-btn active" data-y-mode="pdf"
                  title="PDF-плотность: count / (N × Δx). Значения могут быть &gt; 1 — это нормально для узких бинов.">PDF</button>
                <button class="chart-y-mode-btn" data-y-mode="peak"
                  title="Max-Norm: count / max(count). Сопоставимо с Fig. 7 Mittal et al.">Max-Norm</button>
              </div>
            </div>

            <div class="preview-container chart-container">
              <canvas id="chart-canvas"></canvas>
            </div>
          </div>

          <div class="tab-content" id="tab-features">
            <div class="placeholder-box">Здесь будет таблица из 36 математических параметров BRISQUE</div>
          </div>

        </div>

        <div id="academic-help-container"></div>
      </div>
    </div>
  </div>

  <script type="module" src="./src/renderer.ts"></script>
</body>

</html>
